name: Build Mindustry Java Mod

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Check Android SDK and D8
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          echo "Android platforms:"
          ls "$ANDROID_SDK_ROOT/platforms"
          echo "Android build tools:"
          ls "$ANDROID_SDK_ROOT/build-tools"
          echo "D8:"
          which d8
          d8 --version

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Build Android Mod
        run: ./gradlew deploy --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MindustryMod
          path: build/libs/*.jar
